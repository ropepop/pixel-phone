[package]
name = "pixel-health"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
ticket-health-monitor = ["dep:serde"]
workspace-cleanup = []

[[bin]]
name = "ticket-health-monitor"
path = "src/bin/ticket-health-monitor.rs"
required-features = ["ticket-health-monitor"]

[[bin]]
name = "pixel-runtime-cleanup"
path = "src/bin/pixel-runtime-cleanup.rs"

[[bin]]
name = "pixel-workspace-cleanup"
path = "src/bin/pixel-workspace-cleanup.rs"
required-features = ["workspace-cleanup"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jni = { version = "0.21.1", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", optional = true }
tempfile = "3.27"
sha2 = { version = "=0.10.9", features = ["asm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

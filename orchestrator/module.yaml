schema: 1
module_id: orchestrator
owner: pixel-phone
runtime:
  type: service
  healthcheck: orchestrator/scripts/android/deploy_orchestrator_apk.sh --action health --skip-build
  run_id_env: PIXEL_RUN_ID
components:
  - id: ssh
    start: sh /data/local/pixel-stack/bin/pixel-ssh-start.sh
    stop: sh /data/local/pixel-stack/bin/pixel-ssh-stop.sh
    health: ss -ltn 2>/dev/null | grep -E '[:.]2222[[:space:]]' >/dev/null
    redeploy:
      mode: artifact_release
      artifact_id: dropbear-bundle
  - id: vpn
    start: sh /data/local/pixel-stack/bin/pixel-vpn-start.sh
    stop: sh /data/local/pixel-stack/bin/pixel-vpn-stop.sh
    health: sh /data/local/pixel-stack/bin/pixel-vpn-health.sh
    redeploy:
      mode: artifact_release
      artifact_id: tailscale-bundle
  - id: management
    start: "true"
    stop: "true"
    health: sh /data/local/pixel-stack/bin/pixel-management-health.sh
    redeploy:
      mode: derived
      derived_from: vpn
  - id: ticket_screen
    start: sh /data/local/pixel-stack/bin/pixel-ticket-start.sh
    stop: sh /data/local/pixel-stack/bin/pixel-ticket-stop.sh
    health: sh /data/local/pixel-stack/bin/pixel-ticket-health.sh
    redeploy:
      mode: job
  - id: runtime_cleanup
    start: am start-foreground-service -n lv.jolkins.pixelorchestrator/.app.SupervisorService -a lv.jolkins.pixelorchestrator.action.CLEANUP --es orchestrator_action cleanup --es orchestrator_cleanup_trigger manual
    stop: "true"
    health: latest=$(ls -1t /data/local/pixel-stack/logs/events/cleanup-*.json 2>/dev/null | grep -v -- '-dry-run.json' | sed -n '1p'); [ -n "$latest" ] && ! grep -q '"status"[[:space:]]*:[[:space:]]*"failed"' "$latest"
    redeploy:
      mode: job
observability:
  event_source: android_orchestrator
  evidence_root: ops/evidence/orchestrator

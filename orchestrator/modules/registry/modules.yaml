schema: 1
version: 1
modules:
  - id: ssh
    display_name: SSH
    domain: orchestrator
    runtime_type: rooted_service
    owner_path: orchestrator/android-orchestrator
    health_key: sshHealthy
    component_id: ssh
    start_command: sh /data/local/pixel-stack/bin/pixel-ssh-start.sh
    stop_command: sh /data/local/pixel-stack/bin/pixel-ssh-stop.sh
    health_command: ss -ltn 2>/dev/null | grep -E '[:.]2222[[:space:]]' >/dev/null
    redeploy:
      mode: artifact_release
      artifact_id: dropbear-bundle
  - id: vpn
    display_name: VPN
    domain: orchestrator
    runtime_type: rooted_service
    owner_path: orchestrator/android-orchestrator
    health_key: vpnHealthy
    component_id: vpn
    start_command: sh /data/local/pixel-stack/bin/pixel-vpn-start.sh
    stop_command: sh /data/local/pixel-stack/bin/pixel-vpn-stop.sh
    health_command: sh /data/local/pixel-stack/bin/pixel-vpn-health.sh
    redeploy:
      mode: artifact_release
      artifact_id: tailscale-bundle
  - id: management
    display_name: Management Path
    domain: orchestrator
    runtime_type: synthetic_health
    owner_path: orchestrator/android-orchestrator
    health_key: managementHealthy
    component_id: management
    start_command: true
    stop_command: true
    health_command: sh /data/local/pixel-stack/bin/pixel-management-health.sh
    redeploy:
      mode: derived
      derived_from: vpn
  - id: ticket_screen
    display_name: Ticket Screen
    domain: workloads
    runtime_type: rooted_service
    owner_path: workloads/ticket-screen
    health_key: ticketScreenHealthy
    component_id: ticket_screen
    start_command: sh /data/local/pixel-stack/bin/pixel-ticket-start.sh
    stop_command: sh /data/local/pixel-stack/bin/pixel-ticket-stop.sh
    health_command: sh /data/local/pixel-stack/bin/pixel-ticket-health.sh
    redeploy:
      mode: job
  - id: runtime_cleanup
    display_name: Runtime Cleanup
    domain: orchestrator
    runtime_type: job
    owner_path: orchestrator/android-orchestrator
    health_key: runtimeCleanupHealthy
    component_id: runtime_cleanup
    start_command: am start-foreground-service -n lv.jolkins.pixelorchestrator/.app.SupervisorService -a lv.jolkins.pixelorchestrator.action.CLEANUP --es orchestrator_action cleanup --es orchestrator_cleanup_trigger manual
    stop_command: true
    health_command: latest=$(ls -1t /data/local/pixel-stack/logs/events/cleanup-*.json 2>/dev/null | grep -v -- '-dry-run.json' | sed -n '1p'); [ -n "$latest" ] && ! grep -q '"status"[[:space:]]*:[[:space:]]*"failed"' "$latest"
    redeploy:
      mode: job
